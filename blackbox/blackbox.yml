modules:
  nextcloud_status:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"installed"\s*:\s*true\b'
        - '"maintenance"\s*:\s*false\b'
        - '"needsDbUpgrade"\s*:\s*false\b'

  onlyoffice_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '^\s*true\s*$'
