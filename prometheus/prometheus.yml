global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: nextcloud
    metrics_path: /probe
    params:
      module: [nextcloud_status]
    static_configs:
      - targets:
          - http://10.0.0.11:8090/status.php
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: onlyoffice
    metrics_path: /probe
    params:
      module: [onlyoffice_health]
    static_configs:
      - targets:
          - http://10.0.0.11:8088/healthcheck
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
